# CI de PREP 2027 — build multietapa, smoke tests y empaquetado para
# difusores externos. NO despliega a Azure (todavía no hay recursos).
#
# Esta carpeta (deployment-prep-2027/) no es, hoy, un repositorio git propio.
# Para que este workflow corra de verdad hace falta alojarlo en la raíz de un
# repositorio real como `.github/workflows/build-and-package.yml` — ver
# docs/IMPLEMENTACION-DOCKER.md, sección "Activar este workflow".
#
# Placeholders que hay que completar antes de activarlo (no se inventan
# nombres de organización/repo/registro):
#   - inputs.backend_repo / frontend_repo (o secrets si son privados)
#   - vars.ACR_LOGIN_SERVER / vars.ACR_REPOSITORY (para el push futuro, no usado aún)
#   - un token con permiso de checkout si backend_repo/frontend_repo son privados
#     (secrets.CHECKOUT_TOKEN)

name: build-and-package

on:
  workflow_dispatch:
    inputs:
      backend_repo:
        description: "owner/repo del backend (services-prep-2027)"
        required: true
        type: string
      backend_ref:
        description: "Commit o rama exacta del backend a construir"
        required: true
        type: string
      frontend_repo:
        description: "owner/repo del frontend (publicador-prep-2027)"
        required: true
        type: string
      frontend_ref:
        description: "Commit o rama exacta del frontend a construir"
        required: true
        type: string
      app_version:
        description: "Versión semántica de la imagen (ej. 1.2.0)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend (services-prep-2027)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.backend_repo }}
          ref: ${{ inputs.backend_ref }}
          path: services-prep-2027
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}

      - name: Checkout frontend (publicador-prep-2027)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.frontend_repo }}
          ref: ${{ inputs.frontend_ref }}
          path: publicador-prep-2027
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}

      - name: Checkout deployment (este repo/carpeta)
        uses: actions/checkout@v4
        with:
          path: deployment-prep-2027

      - name: Resolver commits exactos
        id: commits
        run: |
          echo "backend_sha=$(git -C services-prep-2027 rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=$(git -C publicador-prep-2027 rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Node (pnpm vía corepack)
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Backend — install, lint, test, build
        working-directory: services-prep-2027
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test
          pnpm run build

      - name: Frontend — install y build de producción
        working-directory: publicador-prep-2027
        run: |
          npm ci
          npm run build:prod

      - name: Frontend — pruebas headless
        working-directory: publicador-prep-2027
        run: npx ng test --browsers=ChromeHeadless --watch=false

      - name: Set up QEMU (emulación linux/amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment-prep-2027/Dockerfile
          platforms: linux/amd64
          tags: prep-2027:ci-${{ inputs.app_version }}
          load: true
          build-args: |
            APP_VERSION=${{ inputs.app_version }}
            GIT_COMMIT_BACKEND=${{ steps.commits.outputs.backend_sha }}
            GIT_COMMIT_FRONTEND=${{ steps.commits.outputs.frontend_sha }}
            BUILD_DATE=${{ steps.commits.outputs.build_date }}

      - name: Arranque temporal + smoke test
        env:
          JWT_SECRET: ci-smoke-test-secret-no-usar-en-prod
          CORTES_MANIFEST_HMAC_SECRET: ci-smoke-test-hmac-no-usar-en-prod
        run: |
          docker run -d --name prep-ci --platform linux/amd64 -p 3000:3000 \
            -e JWT_SECRET -e CORTES_MANIFEST_HMAC_SECRET \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e SWAGGER_TITLE="PREP API" -e SWAGGER_VERSION=${{ inputs.app_version }} -e SWAGGER_PATH=docs \
            prep-2027:ci-${{ inputs.app_version }}
          for i in $(seq 1 20); do
            sleep 2
            if curl -sf http://127.0.0.1:3000/api/v1/health/live >/dev/null; then break; fi
          done
          chmod +x deployment-prep-2027/scripts/smoke-test.sh
          BASE_URL=http://127.0.0.1:3000 deployment-prep-2027/scripts/smoke-test.sh
          docker logs prep-ci
          docker rm -f prep-ci

      # --- Opcionales: requieren habilitar la Marketplace Action correspondiente ---
      - name: Escaneo de vulnerabilidades (Trivy) [placeholder, deshabilitado]
        if: false
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: prep-2027:ci-${{ inputs.app_version }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Generar SBOM (Syft) [placeholder, deshabilitado]
        if: false
        uses: anchore/sbom-action@v0
        with:
          image: prep-2027:ci-${{ inputs.app_version }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Empaquetar release externo
        env:
          IMAGE_TAG: prep-2027:ci-${{ inputs.app_version }}
          APP_VERSION: ${{ inputs.app_version }}
          GIT_COMMIT_BACKEND: ${{ steps.commits.outputs.backend_sha }}
          GIT_COMMIT_FRONTEND: ${{ steps.commits.outputs.frontend_sha }}
          BUILD_DATE: ${{ steps.commits.outputs.build_date }}
          RELEASE_SIGNING_SECRET: ${{ secrets.RELEASE_SIGNING_SECRET }}
        run: |
          chmod +x deployment-prep-2027/scripts/package-release.sh
          (cd deployment-prep-2027 && ./scripts/package-release.sh)

      - name: Conservar evidencia (release + logs)
        uses: actions/upload-artifact@v4
        with:
          name: prep-2027-release-${{ inputs.app_version }}
          path: deployment-prep-2027/release/**
          retention-days: 30

  # Publicación futura a Azure Container Registry — requiere un GitHub
  # Environment con aprobación manual y OIDC configurado (ver
  # docs/AZURE-READINESS.md). No se ejecuta mientras no exista ese entorno.
  publish-to-acr:
    needs: build-test-package
    if: false # activar cuando exista el Environment + OIDC de Azure
    runs-on: ubuntu-latest
    environment: azure-production # requiere aprobación manual (protection rule)
    steps:
      - name: Placeholder — login OIDC a Azure y push a ACR
        run: |
          echo "Pendiente: az login --service-principal (OIDC) y docker push a \${{ vars.ACR_LOGIN_SERVER }}/\${{ vars.ACR_REPOSITORY }}"
